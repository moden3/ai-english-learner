[package]
name = "eng-app-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-config = "1.10.1"
aws-sdk-dynamodb = "1.120.0"
aws-sdk-ssm = "1.118.0"
chrono = "0.4.45"
lambda_http = "1.3.0"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.24.1", features = ["v4"] }
